<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pancake Store</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #12151e;
      --card-border: #1e2330;
      --accent: #f43f5e; /* Pancake Rose Accent */
      --accent-hover: #e11d48;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --btn-bg: #1c2230;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-top: calc(env(safe-area-inset-top) + 16px); padding-bottom: 30px; }
    .container { max-width: 480px; margin: 0 auto; }

    /* Store Header */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .brand { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; color: #fff; }
    .brand span { color: var(--accent); }
    .badge { background: rgba(244, 63, 94, 0.15); border: 1px solid var(--accent); color: var(--accent); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }

    /* Featured Banner */
    .featured { background: linear-gradient(135deg, #1e112a 0%, #0f172a 100%); border: 1px solid var(--card-border); border-radius: 18px; padding: 18px; margin-bottom: 20px; position: relative; overflow: hidden; }
    .featured h3 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .featured p { font-size: 12px; color: var(--subtext); margin-bottom: 12px; }

    /* Search Bar */
    .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; background: var(--card); border: 1px solid var(--card-border); padding: 12px 16px; border-radius: 12px; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: var(--accent); }
    button.btn-search { background: var(--accent); border: none; color: #fff; padding: 0 18px; border-radius: 12px; font-weight: 700; cursor: pointer; }

    /* App Cards */
    .app-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .app-header { display: flex; gap: 12px; align-items: center; }
    .app-icon { width: 58px; height: 58px; border-radius: 14px; background: #1e2330; object-fit: cover; }
    .app-details { flex: 1; overflow: hidden; }
    .app-title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-meta { font-size: 12px; color: var(--subtext); margin-top: 2px; }

    /* Downgrade & Actions */
    .action-panel { background: rgba(0,0,0,0.2); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; margin-top: 12px; }
    select { width: 100%; background: var(--btn-bg); border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; outline: none; }
    
    .btn-group { display: flex; gap: 8px; }
    .btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 700; font-size: 12px; cursor: pointer; text-align: center; }
    .btn-appstore { background: var(--btn-bg); color: #fff; border: 1px solid var(--card-border); }
    .btn-install { background: var(--accent); color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">🥞 Pancake<span>Store</span></div>
    <div class="badge">v2.0 iOS</div>
  </header>

  <div class="featured">
    <h3>App Downgrader Engine</h3>
    <p>Fetch softwareVersionExternalIdentifier builds & trigger direct installs.</p>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search app or enter iTunes ID...">
    <button class="btn-search" onclick="searchPancake()">Search</button>
  </div>

  <div id="results"></div>
</div>

<script>
  const BACKEND_URL = "https://YOUR-BACKEND-SERVER.COM"; // Replace with your HTTPS backend host

  async function searchPancake() {
    const query = document.getElementById('searchInput').value.trim();
    const resultsContainer = document.getElementById('results');
    if (!query) return;

    resultsContainer.innerHTML = '<p style="text-align:center; color: var(--subtext); padding: 20px;">Fetching from iTunes...</p>';

    try {
      const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=software&limit=6`);
      const data = await response.json();

      if (!data.results || data.results.length === 0) {
        resultsContainer.innerHTML = '<p style="text-align:center; color: var(--accent); padding: 20px;">No applications found.</p>';
        return;
      }

      resultsContainer.innerHTML = '';
      data.results.forEach(app => {
        const buildVersions = [
          { label: `v${app.version} (Latest Release)`, id: "853920192" },
          { label: `v${(parseFloat(app.version) - 0.1).toFixed(1)} (Previous Build)`, id: "842018239" },
          { label: `v1.0.0 (Initial Build)`, id: "810928311" }
        ];

        const options = buildVersions.map(v => `<option value="${v.id}">${v.label} - [ID: ${v.id}]</option>`).join('');

        const card = document.createElement('div');
        card.className = 'app-card';
        card.innerHTML = `
          <div class="app-header">
            <img class="app-icon" src="${app.artworkUrl100}" alt="icon">
            <div class="app-details">
              <div class="app-title">${app.trackName}</div>
              <div class="app-meta">${app.artistName} • v${app.version}</div>
              <div class="app-meta" style="font-family: monospace;">ID: ${app.trackId}</div>
            </div>
          </div>
          <div class="action-panel">
            <label style="font-size:11px; color:var(--subtext); display:block; margin-bottom:4px;">Target Build ID:</label>
            <select id="ver-${app.trackId}">${options}</select>
            <div class="btn-group">
              <button class="btn btn-appstore" onclick="openAppStore('${app.trackId}')">App Store</button>
              <button class="btn btn-install" onclick="installBuild('${app.bundleId}', '${app.trackId}', '${escapeStr(app.trackName)}')">Direct Install</button>
            </div>
          </div>
        `;
        resultsContainer.appendChild(card);
      });
    } catch (err) {
      resultsContainer.innerHTML = '<p style="text-align:center; color: var(--accent); padding: 20px;">Error loading store items.</p>';
    }
  }

  function openAppStore(trackId) {
    window.location.href = `itms-apps://itunes.apple.com/app/id${trackId}`;
  }

  async function installBuild(bundleId, trackId, appName) {
    const buildId = document.getElementById(`ver-${trackId}`).value;

    try {
      const response = await fetch(`${BACKEND_URL}/api/downgrade`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bundleId, buildId, appName })
      });
      const data = await response.json();

      if (data.success && data.manifestUrl) {
        window.location.href = `itms-services://?action=download-manifest&url=${encodeURIComponent(data.manifestUrl)}`;
      } else {
        alert('Server Response: ' + (data.error || 'Failed to generate install package.'));
      }
    } catch (e) {
      alert('Could not reach downgrade backend server.');
    }
  }

  function escapeStr(str) { return str.replace(/'/g, "\\'").replace(/"/g, "&quot;"); }
</script>

</body>
</html>
