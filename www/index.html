<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GhostyStore</title>
  <style>
    :root {
      --bg: #0a0c10;
      --card: #141721;
      --input-bg: #1d2230;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text: #f3f4f6;
      --subtext: #9ca3af;
      --success: #22c55e;
      --border: #272d3d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-top: calc(env(safe-area-inset-top) + 16px); padding-bottom: 40px; }
    .container { max-width: 480px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .logo { font-size: 22px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .badge { background: rgba(139, 92, 246, 0.15); border: 1px solid var(--accent); color: var(--accent); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }

    /* Nav Tabs */
    .nav-tabs { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
    .tab-btn { flex: 1; background: transparent; border: none; color: var(--subtext); padding: 10px; font-weight: 700; font-size: 13px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: var(--accent); color: #fff; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* WebClip Banner */
    .profile-card { background: linear-gradient(135deg, #170d2b 0%, #141721 100%); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .profile-info h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .profile-info p { font-size: 12px; color: var(--subtext); }
    .btn-profile { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 700; text-decoration: none; display: inline-block; }

    /* Cards & Lists */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .app-header { display: flex; gap: 12px; align-items: center; }
    .app-icon { width: 56px; height: 56px; border-radius: 12px; background: #272d3d; object-fit: cover; }
    .app-details { flex: 1; overflow: hidden; }
    .app-title { font-size: 16px; font-weight: 700; }
    .app-sub { font-size: 12px; color: var(--subtext); margin-top: 2px; }

    .version-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); margin-top: 10px; }
    .version-info { font-size: 13px; font-weight: 600; }
    .version-meta { font-size: 11px; color: var(--subtext); }
    
    .btn-action { background: var(--success); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-action:hover { background: #16a34a; }

    /* Search Area */
    .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"], select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: #fff; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }
    .btn-search { background: var(--accent); border: none; color: #fff; padding: 0 18px; border-radius: 10px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">👻 GhostyStore</div>
    <div class="badge">v1.2.6</div>
  </header>

  <div class="profile-card">
    <div class="profile-info">
      <h3>WebClip Configuration</h3>
      <p>Install Home Screen profile target</p>
    </div>
    <a href="ghostystore.mobileconfig" class="btn-profile">Get Profile</a>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('releases')">GhostyStore Builds</button>
    <button class="tab-btn" onclick="switchTab('appstore')">iTunes Search</button>
  </div>

  <!-- GhostyStore IPA Releases Tab -->
  <div id="tab-releases" class="tab-content active">
    <div class="card">
      <div class="app-header">
        <div class="app-icon" style="display:flex; align-items:center; justify-content:center; font-size:28px;">👻</div>
        <div class="app-details">
          <div class="app-title">GhostyStore Client</div>
          <div class="app-sub">Official Repository Builds</div>
        </div>
      </div>
    </div>
    <div id="buildsList"></div>
  </div>

  <!-- iTunes App Store / Downgrade Tab -->
  <div id="tab-appstore" class="tab-content">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search App Store...">
      <button class="btn-search" onclick="searchStore()">Search</button>
    </div>
    <div id="searchResults"></div>
  </div>
</div>

<script>
  const BASE_REPO_URL = "https://skibidimcsus-sudo.github.io/IPA-Test/";

  const ghostyManifest = {
    "app": "GhostyStore",
    "versions": [
      { "version": "1.2.6", "build": "26", "url": "ipa/GhostyStore-1.2.6.ipa", "date": "2026-08-21" },
      { "version": "1.2.5", "build": "25", "url": "ipa/GhostyStore-1.2.5.ipa", "date": "2026-08-20" },
      { "version": "1.2.4", "build": "24", "url": "ipa/GhostyStore-1.2.4.ipa", "date": "2026-08-18" },
      { "version": "1.2.3", "build": "23", "url": "ipa/GhostyStore-1.2.3.ipa", "date": "2026-08-15" },
      { "version": "1.2.2", "build": "22", "url": "ipa/GhostyStore-1.2.2.ipa", "date": "2026-08-12" },
      { "version": "1.2.1", "build": "21", "url": "ipa/GhostyStore-1.2.1.ipa", "date": "2026-08-10" },
      { "version": "1.2.0", "build": "20", "url": "ipa/GhostyStore-1.2.0.ipa", "date": "2026-08-05" }
    ]
  };

  function renderGhostyBuilds() {
    const container = document.getElementById('buildsList');
    container.innerHTML = '';

    ghostyManifest.versions.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      const isLatest = index === 0;

      card.innerHTML = `
        <div class="version-row" style="border-top: none; margin-top: 0;">
          <div>
            <div class="version-info">
              v${item.version} ${isLatest ? '<span style="color:var(--accent); font-size:11px; margin-left:6px;">[LATEST]</span>' : ''}
            </div>
            <div class="version-meta">Build: ${item.build} • Released: ${item.date}</div>
          </div>
          <a class="btn-action" href="${BASE_REPO_URL}${item.url}" download>Download IPA</a>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    if (tab === 'releases') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-releases').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-appstore').classList.add('active');
    }
  }

  async function searchStore() {
    const query = document.getElementById('searchInput').value.trim();
    const container = document.getElementById('searchResults');
    if (!query) return;

    container.innerHTML = '<p style="text-align:center; color: var(--subtext); padding: 20px;">Searching iTunes...</p>';

    try {
      const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=software&limit=5`);
      const data = await response.json();

      if (!data.results || data.results.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--subtext); padding: 20px;">No applications found.</p>';
        return;
      }

      container.innerHTML = '';
      data.results.forEach(app => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="app-header">
            <img class="app-icon" src="${app.artworkUrl100}" alt="Icon">
            <div class="app-details">
              <div class="app-title">${escapeHtml(app.trackName)}</div>
              <div class="app-sub">${escapeHtml(app.artistName)} • v${app.version}</div>
              <div class="app-sub">ID: ${app.trackId}</div>
            </div>
          </div>
          <div style="margin-top: 12px; display: flex; gap: 8px;">
            <button class="btn-action" style="flex:1; background: var(--input-bg); border: 1px solid var(--border);" onclick="openAppStore('${app.trackId}')">App Store</button>
          </div>
        `;
        container.appendChild(card);
      });
    } catch (e) {
      container.innerHTML = '<p style="text-align:center; color: var(--subtext); padding: 20px;">Error loading store items.</p>';
    }
  }

  function openAppStore(trackId) {
    window.location.href = `itms-apps://itunes.apple.com/app/id${trackId}`;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  // Initialize
  renderGhostyBuilds();
</script>

</body>
</html>
