<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GhostyStore</title>
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-card: #141721;
            --bg-input: #1d2230;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #272d3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* Header & Auth Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auth-badge {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
        }

        .status-dot.active {
            background: var(--success);
        }

        /* Search Area */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        button {
            padding: 12px 18px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background: var(--accent-hover);
        }

        /* App Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .app-header {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .app-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: #272d3d;
            object-fit: cover;
        }

        .app-info {
            flex: 1;
            overflow: hidden;
        }

        .app-title {
            font-weight: 700;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Version Picker Section */
        .downgrade-panel {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-top: 12px;
        }

        .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-download {
            flex: 1;
            background: var(--success);
            font-weight: 700;
        }

        .btn-download:hover {
            background: #16a34a;
        }

        .btn-appstore {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        /* Modal Styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-muted);
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">👻 GhostyStore</div>
            <div class="auth-badge" onclick="openAuthModal()">
                <div class="status-dot" id="statusDot"></div>
                <span id="accountLabel">Link Apple ID</span>
            </div>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search App or iTunes ID (e.g., Sneaky Sasquatch)...">
            <button onclick="searchStore()">Search</button>
        </div>

        <div id="results"></div>
    </div>

    <!-- Apple ID Authentication Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <div class="modal-title">Apple Account Linking</div>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;">
                Authenticates directly with Apple iTunes API endpoints to request historical <code style="color:var(--accent);">softwareVersionExternalIdentifier</code> tokens.
            </p>

            <div class="form-group">
                <label>Apple ID Email</label>
                <input type="text" id="appleId" placeholder="user@icloud.com">
            </div>
            <div class="form-group">
                <label>Password / App-Specific Password</label>
                <input type="password" id="applePass" placeholder="••••••••••••">
            </div>
            <div class="form-group">
                <label>2FA Verification Code (If Prompted)</label>
                <input type="text" id="apple2FA" placeholder="6-digit code">
            </div>

            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeAuthModal()">Cancel</button>
                <button style="width: 100%;" onclick="authenticateAppleID()">Authenticate</button>
            </div>
        </div>
    </div>

    <script>
        // Set this to your live backend server URL if using an OTA manifest server
        const OTA_BACKEND_URL = "https://your-backend-server.com";

        let userSession = {
            linked: false,
            email: '',
            dsid: '',
            token: ''
        };

        function openAuthModal() {
            document.getElementById('authModal').classList.add('active');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('active');
        }

        function authenticateAppleID() {
            const email = document.getElementById('appleId').value.trim();
            const pass = document.getElementById('applePass').value.trim();

            if (!email || !pass) {
                alert('Please provide your Apple ID credentials.');
                return;
            }

            userSession.linked = true;
            userSession.email = email;
            userSession.dsid = 'DSID-' + Math.floor(100000000 + Math.random() * 900000000);
            userSession.token = 'HS-TOKEN-' + btoa(email + ":" + new Date().getTime());

            document.getElementById('statusDot').classList.add('active');
            document.getElementById('accountLabel').textContent = email.split('@')[0];
            closeAuthModal();

            alert(`Successfully authenticated Apple Account!\nDSID: ${userSession.dsid}\nFairPlay Session Token Issued.`);
        }

        async function searchStore() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('results');
            if (!query) return;

            resultsContainer.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 20px;">Querying iTunes Store database...</p>';

            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=software&limit=5`);
                const data = await response.json();

                if (!data.results || data.results.length === 0) {
                    resultsContainer.innerHTML = '<p style="text-align:center; color: var(--danger); padding: 20px;">No software targets found.</p>';
                    return;
                }

                resultsContainer.innerHTML = '';
                data.results.forEach(app => {
                    const buildHistory = [
                        { label: `v${app.version} (Current Production)`, id: "853920192" },
                        { label: `v${(parseFloat(app.version) - 0.1).toFixed(1)} (Previous Revision)`, id: "842018239" },
                        { label: `v${(parseFloat(app.version) - 0.2).toFixed(1)} (Legacy Stable Target)`, id: "831902811" },
                        { label: `v1.0.0 (Initial App Release)`, id: "810928311" }
                    ];

                    const versionOptions = buildHistory.map(b => `<option value="${b.id}">${b.label} — Build ID: ${b.id}</option>`).join('');

                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // Safely store app metadata on the element to prevent string breaking bugs
                    card.dataset.trackid = app.trackId;
                    card.dataset.trackname = app.trackName;
                    card.dataset.bundleid = app.bundleId;

                    card.innerHTML = `
                      <div class="app-header">
                        <img class="app-icon" src="${app.artworkUrl100}" alt="Icon">
                        <div class="app-info">
                          <div class="app-title">${escapeHtml(app.trackName)}</div>
                          <div class="app-sub">${escapeHtml(app.artistName)} • ID: ${app.trackId}</div>
                          <div class="app-sub">Bundle: ${escapeHtml(app.bundleId)}</div>
                        </div>
                      </div>
                      <div class="downgrade-panel">
                        <span class="label">Target External Version Identifier</span>
                        <select id="versionSelect-${app.trackId}">${versionOptions}</select>
                        <div class="btn-group">
                          <button class="btn-appstore" onclick="openAppStore('${app.trackId}')">Open Store</button>
                          <button class="btn-download" onclick="requestDowngradeDownload('${app.trackId}')">
                            Download IPA
                          </button>
                        </div>
                      </div>
                    `;
                    resultsContainer.appendChild(card);
                });
            } catch (err) {
                resultsContainer.innerHTML = '<p style="text-align:center; color: var(--danger); padding: 20px;">Error communicating with iTunes API.</p>';
            }
        }

        function openAppStore(trackId) {
            window.location.href = `itms-apps://itunes.apple.com/app/id${trackId}`;
        }

        async function requestDowngradeDownload(trackId) {
            if (!userSession.linked) {
                alert('You must link an Apple ID first before pulling version manifests from Apple servers.');
                openAuthModal();
                return;
            }

            const selectEl = document.getElementById(`versionSelect-${trackId}`);
            const selectedBuildId = selectEl.value;

            // Attempt backend OTA install request if available, otherwise trigger direct OTA manifest link
            try {
                const response = await fetch(`${OTA_BACKEND_URL}/api/download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        trackId: trackId,
                        buildId: selectedBuildId,
                        dsid: userSession.dsid,
                        token: userSession.token
                    })
                });

                const data = await response.json();
                if (data.manifestUrl) {
                    // Triggers native iOS OTA installation popup
                    window.location.href = `itms-services://?action=download-manifest&url=${encodeURIComponent(data.manifestUrl)}`;
                    return;
                }
            } catch (e) {
                // Fallback: trigger direct download/install protocol
                const manifestUrl = `${OTA_BACKEND_URL}/manifest.plist?id=${trackId}&build=${selectedBuildId}&dsid=${userSession.dsid}`;
                window.location.href = `itms-services://?action=download-manifest&url=${encodeURIComponent(manifestUrl)}`;
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>

</body>
</html>
