name: Build iOS App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Install, Build, and Package IPA
        run: |
          npm install
          npm install @capacitor/ios --save
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          cd ios/App
          
          # Build release version for iOS devices without needing Apple certificates
          xcodebuild -project App.xcodeproj -scheme App -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          
          # Package the built .app into an unsigned .ipa file
          mkdir Payload
          cp -r build/Release-iphoneos/App.app Payload/
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-IPA
          path: ios/App/App.ipa
