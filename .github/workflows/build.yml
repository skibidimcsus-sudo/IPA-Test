name: Build iOS App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Initialize and Build iOS Platform
        run: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios
          npx cap init --force --name App --bundle-id com.app.test
          npx cap add ios
          npx cap sync ios
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug build
